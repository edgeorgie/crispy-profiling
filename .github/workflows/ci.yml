name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium (same revision as our playwright-core)
        run: npx tsx src/cli.ts install --with-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built CLI
        run: node dist/cli.js --version
      - name: Package contents
        run: npm pack --dry-run

  manifests:
    name: Plugin & registry manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate Claude Code plugin + marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate . && npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json
      # The expected branch is DERIVED from the live repository rather than
      # restated as a literal here — a hand-maintained copy of the default
      # branch would drift exactly the way scorecard.yml's own trigger did.
      - name: Scorecard triggers on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: npx -y tsx scripts/check-scorecard-branch.ts
      - run: npm ci
      - name: Validate server.json against the MCP registry schema
        run: npx tsx scripts/validate-server-json.ts
