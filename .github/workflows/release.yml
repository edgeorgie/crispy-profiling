# Release flow (GitFlow, see CONTRIBUTING.md):
#   1. release/x.y.z branch from develop; `npm version x.y.z --no-git-tag-version` + sync
#   2. PR release/x.y.z -> main, merge with a merge commit
#   3. publish: either push the tag (git tag vx.y.z && git push origin vx.y.z) or run this
#      workflow from the Actions tab ("Run workflow", version x.y.z), which tags main itself
#   4. merge main back into develop
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from main (must match package.json), e.g. 0.1.1
        required: true
        type: string

permissions:
  contents: write # tag + GitHub release + moving the major tag of the action
  id-token: write # npm provenance + MCP registry OIDC login

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      # Third-party and first-party actions alike are pinned to a full commit
      # SHA, not a floating tag. `v7` is a mutable pointer: a retagged or
      # compromised upstream release would execute here with no diff to
      # review, and this job holds `contents: write` + `id-token: write` and
      # runs `npm publish --provenance`, so that is a supply-chain compromise
      # of a published package rather than just a red build. It is also what
      # OpenSSF Scorecard's Pinned-Dependencies check grades, and this repo
      # advertises its Scorecard badge in the README. Dependabot
      # (.github/dependabot.yml, github-actions ecosystem) bumps these SHAs
      # and rewrites the trailing version comment, so pinning does not mean
      # going stale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run always releases main; a tag push releases that tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$TAG"

      - name: Create the tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n1 "$TAG")" = "$(git rev-parse HEAD)" || { echo "$TAG exists on another commit"; exit 1; }
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - run: npm ci
      - run: npx tsx src/cli.ts install --with-deps
      - run: npm run check

      - name: Publish to npm
        run: |
          if npm view "crispy-profiling@${TAG#v}" version >/dev/null 2>&1; then
            echo "crispy-profiling@${TAG#v} is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait until npm serves the new version
        # The MCP Registry validates the npm package; a fresh publish can take minutes to appear.
        run: |
          for i in $(seq 1 30); do
            npm view "crispy-profiling@${TAG#v}" version >/dev/null 2>&1 && exit 0
            sleep 20
          done
          echo "crispy-profiling@${TAG#v} did not appear on npm after 10 minutes"; exit 1

      - name: Publish to the official MCP Registry
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag

      - name: Move major tag for the GitHub Action (e.g. v0)
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
