# OpenSSF Scorecard: public supply-chain security score shown as a README badge.
name: Scorecard

on:
  # MUST be the repository's DEFAULT branch, not the integration branch.
  # scorecard-action hard-refuses anything else on a push event:
  #
  #   validating options: only default branch is supported
  #   refs/heads/develop not supported with push event.
  #   ##[error]Only the default branch main is supported.
  #
  # This fired on every push to `develop` once the default branch became
  # `main`, so the only security job in this repo was permanently red while
  # the README advertised its badge. The `develop` trigger was correct back
  # when `develop` was the default; nothing in that rename reports that it
  # invalidated this file.
  #
  # Keeping this list in sync with the default branch is load-bearing: point
  # it at a non-default branch and the job cannot succeed by construction.
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
