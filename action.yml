name: crispy-profiling
description: Snapshot testing for React re-renders in CI — fail PRs that add renders, with the fix attached.
author: Edwin Jorge
branding:
  icon: activity
  color: orange
inputs:
  command:
    description: "test (default): check render counts against the committed crispy.snap.json. run: profile and enforce budgets, optionally comparing with a baseline report."
    default: test
  config:
    description: Path to crispy.config.json
    default: crispy.config.json
  out:
    description: "run only: where to write the JSON report"
    default: .crispy/report.json
  baseline:
    description: "run only: optional baseline report to compare against"
    default: ''
  threshold:
    description: "run only: allowed render increase in percent before a component counts as regressed"
    default: '10'
  fail-on-regression:
    description: Fail the job on regressions or budget violations
    default: 'true'
  version:
    description: crispy-profiling version to use (pinned to this release by scripts/sync-version.ts)
    default: 0.1.0
outputs:
  summary:
    description: Path to the Markdown summary
    value: ${{ steps.crispy.outputs.summary }}
runs:
  using: composite
  steps:
    - name: Install crispy-profiling and Chromium
      shell: bash
      env:
        CRISPY_VERSION: ${{ inputs.version }}
      run: |
        dir="$RUNNER_TEMP/crispy"
        npm install --prefix "$dir" --no-save --silent "crispy-profiling@${CRISPY_VERSION}"
        echo "CRISPY_BIN=$dir/node_modules/.bin/crispy" >> "$GITHUB_ENV"
        "$dir/node_modules/.bin/crispy" install --with-deps
    - id: crispy
      name: Run crispy ${{ inputs.command }}
      shell: bash
      env:
        CRISPY_COMMAND: ${{ inputs.command }}
        CRISPY_CONFIG: ${{ inputs.config }}
        CRISPY_OUT: ${{ inputs.out }}
        CRISPY_BASELINE: ${{ inputs.baseline }}
        CRISPY_THRESHOLD: ${{ inputs.threshold }}
        CRISPY_FAIL: ${{ inputs.fail-on-regression }}
      run: |
        set +e
        mkdir -p .crispy
        summary=".crispy/summary.md"
        if [ "$CRISPY_COMMAND" = "test" ]; then
          "$CRISPY_BIN" test -c "$CRISPY_CONFIG" --ci --markdown "$summary"
          status=$?
        else
          flag=""; [ "$CRISPY_FAIL" = "true" ] || flag="--no-fail"
          "$CRISPY_BIN" run -c "$CRISPY_CONFIG" -o "$CRISPY_OUT" --markdown "$summary" $flag
          status=$?
          if [ "$status" -le 1 ] && [ -n "$CRISPY_BASELINE" ] && [ -f "$CRISPY_BASELINE" ]; then
            "$CRISPY_BIN" compare "$CRISPY_BASELINE" "$CRISPY_OUT" --threshold "$CRISPY_THRESHOLD" --markdown "$summary.compare" $flag
            cmp_status=$?
            cat "$summary.compare" >> "$summary"
            [ "$cmp_status" -gt "$status" ] && status=$cmp_status
          fi
        fi
        if [ -f "$summary" ]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
        fi
        if [ "$status" -eq 1 ] && [ "$CRISPY_FAIL" != "true" ]; then status=0; fi
        exit $status
