name: crispy-profiling
description: Snapshot testing for React re-renders in CI — fail PRs that add renders, with the fix attached.
author: Edwin Jorge
branding:
  icon: activity
  color: orange
inputs:
  command:
    description: "test (default): check render counts against the committed crispy.snap.json. run: profile and enforce budgets, optionally comparing with a baseline report."
    default: test
  config:
    description: Path to crispy.config.json
    default: crispy.config.json
  out:
    description: "run only: where to write the JSON report"
    default: .crispy/report.json
  baseline:
    description: "run only: optional baseline report to compare against"
    default: ''
  threshold:
    description: "run only: allowed render increase in percent before a component counts as regressed"
    default: '10'
  fail-on-regression:
    description: Fail the job on regressions or budget violations
    default: 'true'
  comment:
    description: "On pull requests, post the result as one PR comment that is updated on every run (needs `permissions: pull-requests: write`). Passing runs only update an existing comment."
    default: 'true'
  version:
    description: crispy-profiling version to use (pinned to this release by scripts/sync-version.ts)
    default: 0.1.0
outputs:
  summary:
    description: Path to the Markdown summary
    value: ${{ steps.crispy.outputs.summary }}
runs:
  using: composite
  steps:
    - name: Install crispy-profiling and Chromium
      shell: bash
      env:
        CRISPY_VERSION: ${{ inputs.version }}
      run: |
        dir="$RUNNER_TEMP/crispy"
        npm install --prefix "$dir" --no-save --silent "crispy-profiling@${CRISPY_VERSION}"
        echo "CRISPY_BIN=$dir/node_modules/.bin/crispy" >> "$GITHUB_ENV"
        "$dir/node_modules/.bin/crispy" install --with-deps
    - id: crispy
      name: Run crispy ${{ inputs.command }}
      shell: bash
      env:
        CRISPY_COMMAND: ${{ inputs.command }}
        CRISPY_CONFIG: ${{ inputs.config }}
        CRISPY_OUT: ${{ inputs.out }}
        CRISPY_BASELINE: ${{ inputs.baseline }}
        CRISPY_THRESHOLD: ${{ inputs.threshold }}
        CRISPY_FAIL: ${{ inputs.fail-on-regression }}
      run: |
        set +e
        mkdir -p .crispy
        summary=".crispy/summary.md"
        log=".crispy/crispy.log"
        if [ "$CRISPY_COMMAND" = "test" ]; then
          "$CRISPY_BIN" test -c "$CRISPY_CONFIG" --ci --markdown "$summary" 2> >(tee "$log" >&2)
          status=$?
        else
          flag=""; [ "$CRISPY_FAIL" = "true" ] || flag="--no-fail"
          "$CRISPY_BIN" run -c "$CRISPY_CONFIG" -o "$CRISPY_OUT" --markdown "$summary" $flag 2> >(tee "$log" >&2)
          status=$?
          if [ "$status" -le 1 ] && [ -n "$CRISPY_BASELINE" ] && [ -f "$CRISPY_BASELINE" ]; then
            "$CRISPY_BIN" compare "$CRISPY_BASELINE" "$CRISPY_OUT" --threshold "$CRISPY_THRESHOLD" --markdown "$summary.compare" $flag
            cmp_status=$?
            cat "$summary.compare" >> "$summary"
            [ "$cmp_status" -gt "$status" ] && status=$cmp_status
          fi
        fi
        # crispy could not run (e.g. the dev server failed): still explain why.
        if [ ! -f "$summary" ] || [ "$status" -ge 2 ]; then
          {
            echo "## 🥓 crispy render snapshots: ❌ could not run"
            echo
            echo '```text'
            grep -v '^\[crispy\] .*: run [0-9]' "$log" 2>/dev/null | tail -25
            echo '```'
          } > "$summary"
        fi
        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        echo "summary=$summary" >> "$GITHUB_OUTPUT"
        if [ "$status" -eq 1 ] && [ "$CRISPY_FAIL" != "true" ]; then status=0; fi
        exit $status
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.crispy.outputs.summary != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CRISPY_SUMMARY: ${{ steps.crispy.outputs.summary }}
        CRISPY_OUTCOME: ${{ steps.crispy.outcome }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        marker='<!-- crispy-profiling -->'
        body_file="$(mktemp)"
        {
          echo "$marker"
          # GitHub comments are limited to 65,536 characters; the job summary has the rest.
          head -c 60000 "$CRISPY_SUMMARY"
          if [ "$(wc -c < "$CRISPY_SUMMARY")" -gt 60000 ]; then
            printf '\n\n…truncated: the full report is in the job summary (%s).\n' "$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          fi
        } > "$body_file"
        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" 2>/dev/null | head -1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$body_file" >/dev/null \
            || echo "::warning::crispy could not update its PR comment (needs pull-requests: write)"
        elif [ "$CRISPY_OUTCOME" != "success" ] || grep -q "🟢\|🆕\|🔁\|⚠️" "$CRISPY_SUMMARY"; then
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$body_file" >/dev/null \
            || echo "::warning::crispy could not comment on the PR (needs pull-requests: write)"
        fi
