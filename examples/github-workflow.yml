# Copy to .github/workflows/react-renders.yml in your app.
# On every PR: start the app, check render counts against the committed
# crispy.snap.json and fail if any component renders more. The job summary lists
# each regression with the cause, where it is rendered and the suggested fix.
#
# First time: run `npx crispy test` locally and commit crispy.snap.json.
# Intended changes: run `npx crispy test -u` and commit the updated file.
name: React renders

on:
  pull_request:

jobs:
  renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the app (development build)
        run: |
          npm run dev -- --port 5173 &
          npx -y wait-on http://localhost:5173
      - uses: edgeorgie/crispy-profiling@v0
        with:
          config: crispy.config.json
