# Copy to .github/workflows/react-renders.yml in your app.
# On every PR: start the app (webServer in crispy.config.json), check render
# counts against the committed crispy.snap.json and fail if any component renders
# more. The job summary and a PR comment list each regression with the cause,
# where it is rendered and the suggested fix.
#
# First time: run `npx crispy test` locally and commit crispy.snap.json.
# Intended changes: run `npx crispy test -u` and commit the updated file.
name: React renders

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # the PR comment

jobs:
  renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: edgeorgie/crispy-profiling@v0
        with:
          config: crispy.config.json
