# Copy to .github/workflows/react-renders.yml in your app.
# On every PR: profile the base branch and the PR, fail on render regressions and
# post the comparison in the job summary.
name: React renders

on:
  pull_request:

jobs:
  renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dev -- --port 5173 & npx -y wait-on http://localhost:5173
      - uses: edgeorgie/crispy-profilling@v0
        with:
          out: .crispy/base.json
          fail-on-regression: 'false'
      - run: kill $(lsof -t -i:5173) || true

      - uses: actions/checkout@v7
        with:
          clean: false # keep .crispy/base.json
      - run: npm ci
      - run: npm run dev -- --port 5173 & npx -y wait-on http://localhost:5173
      - uses: edgeorgie/crispy-profilling@v0
        with:
          out: .crispy/head.json
          baseline: .crispy/base.json
